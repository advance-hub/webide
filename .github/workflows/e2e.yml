name: IDE browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '12.8.1'
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build:all
      - run: pnpm download-extension
      - run: pnpm --dir tools/playwright exec playwright install --with-deps chromium
      - name: IDE UI regression
        shell: bash
        run: |
          SUPPORT_LOAD_WORKSPACE_BY_HASH=true OPENSUMI_E2E_COMMANDS=true pnpm start:e2e > /tmp/webide-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          bash tools/playwright/scripts/wait.sh
          pnpm --dir tools/playwright ui-tests-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            tools/playwright/test-results
            /tmp/webide-e2e.log
