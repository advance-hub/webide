name: Node 24 regression
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [node, jsdom]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '12.8.1'
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build:all
      - name: Compare architecture with the preceding revision
        run: |
          ARCHITECTURE_BASELINE_REF=HEAD^
          pnpm check:architecture --baseline-ref="$ARCHITECTURE_BASELINE_REF"
      - run: pnpm test --selectProjects ${{ matrix.project }} --runInBand
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.project }}
          path: coverage
