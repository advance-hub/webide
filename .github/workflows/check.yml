name: Node product platforms
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '12.8.1'
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build:all
      - run: pnpm typecheck:scripts
      - run: pnpm --filter @opensumi/server test:diagnostics
      - run: pnpm test:runtime-scripts
      - run: pnpm check:product
      - run: pnpm test:workbench
      - run: pnpm test:application-runtime
      - run: pnpm test:extension-bundle
