name: Build WebIDE images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Local image artifact tag'
        required: true
        default: dev
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag
        run: node -e "if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$/.test(process.env.IMAGE_TAG))process.exit(1)"
      - name: Build Node control plane and workspace
        run: |
          docker build -t "webide-node:$IMAGE_TAG" .
          docker build -f application/runtime/Dockerfile --build-arg "OPENSUMI_BASE=webide-node:$IMAGE_TAG" -t "webide-workspace:$IMAGE_TAG" .
          docker run --rm --entrypoint node "webide-workspace:$IMAGE_TAG" -e "if(!process.version.startsWith('v24.'))process.exit(1)"
          docker save "webide-node:$IMAGE_TAG" "webide-workspace:$IMAGE_TAG" | gzip > webide-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: webide-images-${{ inputs.tag }}
          path: webide-images.tar.gz
          retention-days: 7
