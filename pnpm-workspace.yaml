packages:
  - application
  - client
  - packages/*
  - server
  - tools/dev-tool
  - tools/playwright
  - tools/cli-engine
  - tools/electron

# OpenSumi 历史上使用 Yarn 的 node-modules 布局，先使用提升布局
# 保持兼容，再逐步收紧包边界。
nodeLinker: hoisted
sharedWorkspaceLockfile: true
saveWorkspaceProtocol: rolling
engineStrict: true

# React 和其他共用的对等依赖使用根目录固定版本。
# 避免隔离的工作区因为可选对等依赖允许新主版本
# 而自动安装第二份框架运行时。
resolvePeersFromWorkspaceRoot: true

# react-chat-elements 声明 react-dom 18.2.0，但兼容
# 当前 React 18.3 运行时。保持单例运行时，并声明
# 这项经过兼容检查的对等依赖例外。
peerDependencyRules:
  allowedVersions:
    react-dom: 18.3.1

# 开发机内存受限，脚本命令不应意外触发安装。
# 依赖安装始终通过显式操作执行。
verifyDepsBeforeRun: false

# 原生依赖构建可能产生多个高内存子进程，
# 因此串行构建，并限制包注册表的并发请求。
# 依赖解析仍然共用工作区锁文件。
childConcurrency: 1
networkConcurrency: 8

# 历史 notebook/Plotly 栈引入的 mapbox-gl 分发链仍包含
# Git 子依赖；可视化栈完成迁移前暂时允许，
# 实际版本由下面的覆盖配置固定。
blockExoticSubdeps: false

# @y/websocket-server 0.1.1 支持 Yjs 13，但声明 y-leveldb 0.1
# 为可选依赖。固定兼容的 0.2 版本，移除 Node 24 协作运行时中
# 已经过时的 leveldown@5 原生模块。
overrides:
  '@difizen/mana-app': 0.1.27
  '@difizen/mana-common': 0.1.27
  '@difizen/mana-core': 0.1.27
  '@difizen/mana-l10n': 0.1.27
  '@difizen/mana-observable': 0.1.27
  '@difizen/mana-react': 0.1.27
  '@difizen/mana-syringe': 0.1.27
  '@babel/runtime@<7.26.10': 7.28.4
  '@types/react': 18.3.28
  '@types/react-dom': 18.3.7
  '@furyjs/fury>node-gyp': 12.4.0
  '@y/websocket-server>ws': 6.2.4
  '@y/websocket-server>y-leveldb': 0.2.0
  'cross-spawn@<6.0.6': 6.0.6
  'jsondiffpatch@<0.7.2': 0.7.2
  'linkify-it@<=5.0.1': 5.0.2
  'micromatch@<4.0.8': 4.0.8
  mapbox-gl: 1.13.3
  mapbox-gl-function: 1.3.0
  markdown-it: 14.3.1
  'uuid@<11.1.1': 11.1.1

# pnpm 默认禁用依赖构建脚本；显式允许可信的原生和运行时包，
# 继续禁用仅用于提示信息的安装后脚本。
allowBuilds:
  pnpm: true
  '@opensumi/ripgrep': true
  '@parcel/watcher': true
  classic-level: true
  core-js: false
  electron: true
  es5-ext: false
  esbuild: true
  keytar: true
  leveldown: false
  node-pty: true
  nsfw: true
  nx: true
  '@vscode/spdlog': true
  unrs-resolver: true
  protobufjs: false
patchedDependencies:
  '@opensumi/monaco-editor-core@0.54.0-patch.2': patches/@opensumi__monaco-editor-core@0.54.0-patch.2.patch
